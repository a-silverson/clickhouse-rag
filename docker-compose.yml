services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33.6
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: rag
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./docker/clickhouse/default-network.xml:/etc/clickhouse-server/users.d/default-network.xml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  clickhouse-data:
